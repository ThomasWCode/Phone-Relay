[versions]
# The owner's set (as Decrastination's): AGP 9.0.x supports compileSdk up to 36.1, so these are
# the newest AndroidX releases that fit compileSdk 36.
agp = "9.0.1"
kotlin = "2.2.10"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
lifecycle = "2.10.0"
# Newest release built for Kotlin 2.2 (later ones target 2.3+).
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "4.12.0"
junit = "4.13.2"
# The app's own adb client (the shell bridge): libadb pulls BouncyCastle 1.81 and SPAKE2 (pairing);
# bcpkix of the same release signs the app's certificate; Conscrypt gives libadb TLS 1.3 and the
# keying material pairing needs, without hidden APIs.
libadb = "3.1.1"
bouncycastle = "1.81"
conscrypt = "2.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
libadb-android = { group = "com.github.MuntashirAkon", name = "libadb-android", version.ref = "libadb" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk15to18", version.ref = "bouncycastle" }
conscrypt-android = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
