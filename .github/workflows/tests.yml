# Runs the Worker unit tests and type-check, the phone client unit tests, the
# local end-to-end test (wrangler dev + phone client + fake adb), and the
# Android app's unit tests, build and lint, on every pull request and every push
# to main. No Cloudflare account or phone needed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r phone/requirements.txt pillow
      - run: python -m unittest discover -s phone/tests -v

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The runner's Android SDK (ANDROID_HOME); no app signing key, so the default debug key signs.
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: relay
      - run: python -m pip install -r phone/requirements.txt pillow
      - run: python scripts/e2e_test.py
      - name: Logs (on failure)
        if: failure()
        run: tail -n 100 /tmp/phone-relay-e2e-*/*.log
